apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: es-tls
  namespace: monitoring
spec:
  secretName: es-tls
  dnsNames:
    - es.cg5labs.net
  issuerRef:
    name: letsencrypt-production
    kind: Issuer
---
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: elasticsearch-lan-allowlist
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  ipAllowList:
    sourceRange:
      - 192.168.17.0/24
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: es-traefik
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: elasticsearch-instance
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`es.cg5labs.net`)
      middlewares:
        - name: elasticsearch-lan-allowlist
      services:
        - name: elk-kb-http
          port: 5601
  tls:
    # Kibana terminates TLS with es-tls; Traefik forwards the encrypted connection.
    passthrough: true
