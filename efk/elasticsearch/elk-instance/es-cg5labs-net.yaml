apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: elasticsearch-lan-allowlist
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  ipAllowList:
    sourceRange:
      - 192.168.17.0/24
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: es-traefik
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: elasticsearch-instance
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`es.cg5labs.net`)
      middlewares:
        - name: elasticsearch-lan-allowlist
      services:
        - name: elk-kb-http
          port: 5601
  tls:
    passthrough: true
