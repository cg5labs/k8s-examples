---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-nextcloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://cg5labs.github.io/helm-charts/'
    targetRevision: "5.3.1"
    helm:
      valueFiles:
        - values.yaml
    chart: postgresql-nextcloud
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nextcloud
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
